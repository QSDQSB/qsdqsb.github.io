<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>body{margin:0;background:#000}canvas{display:block}</style>
</head>
<body>
<canvas id="gl"></canvas>
<script>
/* Headless single-frame renderer for the Lontananza shader.
   Query params: photo, depth (URL paths), amp (0-200 UI scale), focus (0-1),
   tx, ty (tilt -0.5..0.5), w (canvas width px), even (0/1). Sets
   window.__done = true after the frame is drawn. */
(function () {
  'use strict';
  var Q = new URLSearchParams(location.search);
  var PHOTO = Q.get('photo');
  var DEPTH = Q.get('depth');
  var AMP = (parseFloat(Q.get('amp') || '60') / 100) * 0.05;
  var FOCUS = parseFloat(Q.get('focus') || '0.75');
  var TX = parseFloat(Q.get('tx') || '0');
  var TY = parseFloat(Q.get('ty') || '0');
  var W = parseInt(Q.get('w') || '1200', 10);
  var EVEN = Q.get('even') === '1';
  var AY = parseFloat(Q.get('ay') || '1'); // y-amp multiplier (anisotropic parallax)

  var VERT = 'attribute vec2 aPos; varying vec2 vUv;' +
    'void main(){ vUv = aPos*0.5+0.5; vUv.y = 1.0-vUv.y; gl_Position = vec4(aPos,0.,1.); }';
  var FRAG = [
    'precision mediump float; varying vec2 vUv;',
    'uniform sampler2D uPhoto; uniform sampler2D uDepth;',
    'uniform vec2 uTilt; uniform vec2 uCover; uniform float uAmp; uniform float uFocus; uniform float uEven; uniform float uAY;',
    'void main(){',
    '  vec2 uv = (vUv-0.5)*uCover*0.94+0.5;',
    '  vec2 off = uTilt*uAmp*mix(vec2(1.0), uCover, uEven)*vec2(1.0, uAY);',
    '  float d = texture2D(uDepth, uv).r;',
    '  vec2 p = uv+off*(d-uFocus); d = texture2D(uDepth,p).r;',
    '  p = uv+off*(d-uFocus); d = texture2D(uDepth,p).r;',
    '  p = uv+off*(d-uFocus); d = texture2D(uDepth,p).r;',
    '  p = uv+off*(d-uFocus);',
    '  gl_FragColor = vec4(texture2D(uPhoto,p).rgb, 1.0);',
    '}'
  ].join('\n');

  var canvas = document.getElementById('gl');
  var gl = canvas.getContext('webgl', { antialias: false, alpha: false, preserveDrawingBuffer: true });
  function sh(t, s) { var o = gl.createShader(t); gl.shaderSource(o, s); gl.compileShader(o); return o; }
  var prog = gl.createProgram();
  gl.attachShader(prog, sh(gl.VERTEX_SHADER, VERT));
  gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, FRAG));
  gl.linkProgram(prog);
  gl.useProgram(prog);
  var buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  var aPos = gl.getAttribLocation(prog, 'aPos');
  gl.enableVertexAttribArray(aPos);
  gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);
  var U = {};
  ['uPhoto', 'uDepth', 'uTilt', 'uCover', 'uAmp', 'uFocus', 'uEven', 'uAY'].forEach(function (n) { U[n] = gl.getUniformLocation(prog, n); });
  gl.uniform1i(U.uPhoto, 0);
  gl.uniform1i(U.uDepth, 1);

  var loaded = 0, aspect = 3;
  function tex(unit, src, isPhoto) {
    var t = gl.createTexture();
    var img = new Image();
    img.onload = function () {
      if (isPhoto) aspect = img.naturalWidth / img.naturalHeight;
      gl.activeTexture(gl.TEXTURE0 + unit);
      gl.bindTexture(gl.TEXTURE_2D, t);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGB, gl.RGB, gl.UNSIGNED_BYTE, img);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
      loaded += 1;
      if (loaded === 2) draw();
    };
    img.onerror = function () { document.title = 'LOAD FAIL ' + src; };
    img.src = src;
  }
  function draw() {
    var w = W, h = Math.round(W / aspect);
    canvas.width = w;
    canvas.height = h;
    gl.viewport(0, 0, w, h);
    gl.uniform2f(U.uTilt, TX, TY);
    gl.uniform2f(U.uCover, 1, 1); // full-frame: no crop, we want to see everything
    gl.uniform1f(U.uAmp, AMP);
    gl.uniform1f(U.uFocus, FOCUS);
    gl.uniform1f(U.uEven, EVEN ? 1 : 0);
    gl.uniform1f(U.uAY, AY);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    window.__done = true;
  }
  tex(0, PHOTO, true);
  tex(1, DEPTH, false);
})();
</script>
</body>
</html>
