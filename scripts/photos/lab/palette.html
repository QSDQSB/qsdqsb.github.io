<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Signature palettes · lab</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="/assets/css/main.css">
<!--
  The signature-palette lab (scripts/photos/dots-lab.mjs writes this page and data.json beside it).
  Each photograph's three to five colours with their shares (scripts/photos/lib/signature.mjs), its
  colour line and the bar as the specs panel draws it; each voyage's own, pooled, without black or
  white; and every voyage side by side. Local only: /lab/ is git-ignored.
-->
<style>
  :root { --ink: #e4e4e4; --ink-2: #b9b9b9; --ink-3: #8b9296; --line: #2e2e2e; --ground: #151515; }
  html, body { background: var(--ground); color: var(--ink); }
  /* The site colours its h2 peach and its h3 pink; the lab's titles are ink, like the Photobook's. */
  h1, h2, h3, h4 { color: var(--ink); }
  body { display: block; margin: 0; font-family: Barlow, system-ui, sans-serif; }
  .lab { max-width: 90rem; margin: 0 auto; padding: 3.5rem clamp(1rem, 3vw, 2.4rem) 5rem; }
  .kicker { margin: 0; font: 500 .62rem/1 Barlow, sans-serif; letter-spacing: .24em; text-transform: uppercase; color: var(--ink-3); }
  h1 { margin: .8rem 0 0; font: 700 clamp(1.8rem, 3.2vw, 2.8rem)/1 "Playfair Display", serif; color: var(--ink); }
  h2 { margin: 0; font: 700 1.5rem "Playfair Display", serif; color: var(--ink); } /* the site colours its h2; the lab's titles stay ink */
  .lede { margin: .8rem 0 0; max-width: 48rem; font: italic 400 1.1rem/1.4 Didot, "Playfair Display", serif; color: var(--ink-2); }
  .bar { position: sticky; top: 0; z-index: 5; display: flex; flex-wrap: wrap; gap: .9rem 2rem; align-items: center; margin: 2.2rem 0 0; padding: .9rem 0; background: rgba(21,21,21,.92); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
  .group { display: flex; align-items: center; gap: .15rem; }
  .group > span { margin-right: .6rem; font: 500 .56rem Barlow, sans-serif; letter-spacing: .22em; text-transform: uppercase; color: var(--ink-3); }
  .group button, select { padding: .35rem .6rem; border: 1px solid transparent; border-radius: 5px; background: none; color: var(--ink-3); font: 500 .74rem Barlow, sans-serif; cursor: pointer; }
  .group button[aria-pressed="true"] { color: var(--ink); border-color: var(--line); background: rgba(255,255,255,.05); }
  select { border-color: var(--line); color: var(--ink); background: #1c1c1c; }
  .note { margin: .6rem 0 0; font: 400 .72rem/1.5 Barlow, sans-serif; color: var(--ink-3); max-width: 62rem; }

  /* the palette, as blocks: equal width, the hex inside, the share beneath */
  .swatches { display: flex; gap: 0; }
  .swatches > div { flex: 1 1 0; min-width: 0; }
  .swatches i { display: grid; place-items: center; height: var(--h, 1.6rem); background: var(--c); font: 500 .62rem Barlow, sans-serif; font-style: normal; letter-spacing: .06em; color: var(--on); }
  .swatches b { display: block; margin-top: .3rem; font: 400 .68rem Barlow, sans-serif; color: var(--ink-2); font-variant-numeric: tabular-nums; }
  .swatches .acc b::after { content: " · accent"; color: var(--ink-3); }
  .strip { display: flex; gap: 2px; height: 12px; }
  .strip i { background: var(--c); border-radius: 1px; }
  .strips { display: grid; grid-template-columns: 4.6rem 1fr; gap: .45rem .6rem; align-items: center; margin-top: .9rem; font: 500 .55rem Barlow, sans-serif; letter-spacing: .18em; text-transform: uppercase; color: var(--ink-3); }


  /* the voyage */
  .pl-voyage { display: grid; grid-template-columns: minmax(0, 1fr) 10rem; gap: 2rem; align-items: start; margin-top: 2rem; padding-bottom: 2.4rem; border-bottom: 1px dotted var(--line); }
  .pl-voyage .swatches i { --h: 2.5rem; }

  /* the photographs */
  .pl-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(19rem, 1fr)); gap: 2.6rem 1.6rem; margin-top: 2.4rem; }
  .pl-card img.print { display: block; width: 100%; aspect-ratio: 3 / 2; object-fit: cover; background: #1d1d1d; }
  .pl-card .swatches { margin-top: 0; }
  .pl-card .pl-row { display: grid; grid-template-columns: 1fr 5.2rem; gap: .9rem; align-items: start; margin-top: .9rem; }
  .pl-card h3 { margin: .8rem 0 0; font: 500 .9rem Barlow, sans-serif; }
  .pl-card h3 small { margin-left: .5rem; font-size: .66rem; letter-spacing: .1em; color: var(--ink-3); text-transform: uppercase; }
  svg.line { width: 100%; height: auto; display: block; }

  /* every voyage */
  .pl-atlas { margin-top: 3rem; }
  .pl-atlas table { width: 100%; border-collapse: collapse; font: 400 .72rem Barlow, sans-serif; color: var(--ink-2); }
  .pl-atlas td, .pl-atlas th { padding: .55rem .6rem; border-bottom: 1px solid var(--line); text-align: left; vertical-align: middle; }
  .pl-atlas th { font: 500 .55rem Barlow, sans-serif; letter-spacing: .18em; text-transform: uppercase; color: var(--ink-3); }
  .pl-atlas .strip { width: 28rem; height: 16px; }
  .pl-atlas tr { cursor: pointer; }
  .pl-atlas tr:hover td { background: #1b1b1b; }
  @media (max-width: 760px) { .pl-voyage { grid-template-columns: 1fr; } .pl-atlas .strip { width: 8rem; } }
</style>
</head>
<body>
<main class="lab">
  <p class="kicker">Lab · the colour of a photograph</p>
  <h1>Signature palettes</h1>
  <p class="lede">Three to five colours for each photograph, with their shares: colour first, the greys no more than the ground it stands on, a vivid accent kept however small; and for each voyage, its own, without black or white.</p>
  <div class="bar">
    <label class="group"><span>Voyage</span><select id="voyage"></select></label>
    <div class="group" id="view"><span>Show</span><button data-v="voyage" aria-pressed="true">One voyage</button><button data-v="atlas">Every voyage</button></div>
  </div>
  <div id="stage"></div>
</main>
<script type="module">
const data = await (await fetch('data.json')).json();
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const lum = (h) => { const n = parseInt(h.slice(1), 16); return (0.2126 * (n >> 16) + 0.7152 * ((n >> 8) & 255) + 0.0722 * (n & 255)) / 255; };
const on = (h) => (lum(h) > 0.55 ? 'rgba(0,0,0,.72)' : 'rgba(255,255,255,.82)');
const state = { g: data.galleries.some(g => g.g === 'london') ? 'london' : data.galleries[0].g, view: 'voyage' };

const blocks = (cs) => `<div class="swatches">${cs.map(c => `<div class="${c.accent ? 'acc' : ''}"><i style="--c:${c.hex};--on:${on(c.hex)}">${c.hex.slice(1).toUpperCase()}</i><b>${c.pc}%</b></div>`).join('')}</div>`;
// As the specs panel would draw it: widths tempered (the square root of each share), so a black that
// fills most of the frame still shows as the largest band without drowning the rest.
const strip = (cs, temper = true) => `<div class="strip">${cs.map(c => `<i style="--c:${c.hex};flex:${temper ? Math.sqrt(c.pc) : c.pc}"></i>`).join('')}</div>`;

// The colour line: the swatches on the plane of hue and chroma (OKLab a–b), dark to light, joined.
function line(cs, size = 120) {
  const R = size / 2 - 8, k = R / 0.2, c = size / 2;
  const ring = Array.from({ length: 36 }, (_, i) => { const t = i / 36 * 2 * Math.PI; const x = c + R * Math.cos(t), y = c - R * Math.sin(t);
    const a = 0.12 * Math.cos(t), b = 0.12 * Math.sin(t); return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="1.6" fill="${hexOfLab(0.7, a, b)}" opacity=".55"/>`; }).join('');
  const pts = cs.map(s => [c + Math.max(-R, Math.min(R, s.a * k)), c - Math.max(-R, Math.min(R, s.b * k)), s]);
  return `<svg class="line" viewBox="0 0 ${size} ${size}" aria-hidden="true"><circle cx="${c}" cy="${c}" r="${R}" fill="none" stroke="#2a2a2a"/>${ring}<circle cx="${c}" cy="${c}" r="1.5" fill="#555"/>
    <polyline points="${pts.map(([x, y]) => `${x.toFixed(1)},${y.toFixed(1)}`).join(' ')}" fill="none" stroke="#bdbdbd" stroke-width="1" stroke-linejoin="round"/>
    ${pts.map(([x, y, s]) => `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${(2.5 + Math.sqrt(s.pc) * 0.9).toFixed(1)}" fill="${s.hex}" stroke="#151515" stroke-width="1"/>`).join('')}</svg>`;
}
function hexOfLab(L, a, b) {
  const l = (L + 0.3963377774 * a + 0.2158037573 * b) ** 3, m = (L - 0.1055613458 * a - 0.0638541728 * b) ** 3, s = (L - 0.0894841775 * a - 1.291485548 * b) ** 3;
  const g = (v) => { const x = v <= 0.0031308 ? 12.92 * v : 1.055 * v ** (1 / 2.4) - 0.055; return Math.round(Math.min(1, Math.max(0, x)) * 255).toString(16).padStart(2, '0'); };
  return `#${g(4.0767416621 * l - 3.3077115913 * m + 0.2309699292 * s)}${g(-1.2684380046 * l + 2.6097574011 * m - 0.3413193965 * s)}${g(-0.0041960863 * l - 0.7034186147 * m + 1.707614701 * s)}`;
}


const sel = document.getElementById('voyage');
sel.innerHTML = data.galleries.map(g => `<option value="${g.g}">${esc(g.title)} (${g.photos.length})</option>`).join('');
sel.value = state.g;
sel.onchange = () => { state.g = sel.value; state.view = 'voyage'; sync(); draw(); };
const viewEl = document.getElementById('view');
const sync = () => viewEl.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === state.view)));
viewEl.onclick = (e) => { const b = e.target.closest('button'); if (!b) return; state.view = b.dataset.v; sync(); draw(); };

const stage = document.getElementById('stage');
function draw() {
  if (state.view === 'atlas') {
    const gs = data.galleries.filter(g => g.voyage);
    stage.innerHTML = `<section class="pl-atlas"><h2>Every voyage</h2><p class="note">Each voyage's pooled signature: every photograph counting once, and no black or white, since every trip has its nights and shadows. A row opens the voyage.</p>
      <table><thead><tr><th>Voyage</th><th>Signature</th><th>Photos</th></tr></thead><tbody>
      ${gs.map(g => `<tr data-g="${g.g}"><td>${esc(g.title)}</td><td>${strip(g.voyage.colours)}</td><td>${g.photos.length}</td></tr>`).join('')}
      </tbody></table></section>`;
    stage.querySelector('tbody').onclick = (e) => { const tr = e.target.closest('tr'); if (!tr) return; state.g = sel.value = tr.dataset.g; state.view = 'voyage'; sync(); draw(); scrollTo(0, 0); };
    return;
  }
  const g = data.galleries.find(x => x.g === state.g);
  stage.innerHTML = `${g.voyage ? `<section class="pl-voyage">
      <div><p class="kicker">The voyage, pooled</p><h2 style="margin:.5rem 0 1rem">${esc(g.title)}</h2>${blocks(g.voyage.colours)}</div>
      <div>${line(g.voyage.colours, 160)}</div>
    </section>` : ''}
    <p class="note">Under each photograph: its signature (hex, and its share of the picture), the colour line (the swatches on the wheel of hue, joined from dark to light: a short line is one family of colour, a line through the centre a pair of opposites), and the bar as the specs panel draws it (widths tempered).</p>
    <div class="pl-cards">${g.photos.map(p => `<article class="pl-card">
      <img class="print" loading="lazy" src="${p.url}/960.webp" alt="">
      ${blocks(p.colours)}
      <div class="pl-row"><div>
        <h3>${esc(p.name)}${p.light ? `<small>${esc(p.light)}</small>` : ''}</h3>
        <div class="strips"><span>In the specs</span>${strip(p.colours)}</div>
      </div>${line(p.colours)}</div>
    </article>`).join('')}</div>`;
}
draw();
</script>
</body>
</html>
