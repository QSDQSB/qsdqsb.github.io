<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A voyage's mood · lab</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="/assets/css/main.css">
<!--
  The mood lab: one large colour image per voyage, in four registers, for choosing the one that sits
  at the top of QSD's Palette for <voyage>. Painterly (soft fields, a Rothko at dusk), celestial (every
  frame's dots as a nebula), editorial (a printed colour index), textile (every frame woven as a
  patch). Reads /assets/palettes.json, the page's own data. Local only: /lab/ is git-ignored;
  scripts/photos/dots-lab.mjs copies this page there.
-->
<style>
  :root { --ink: #e4e4e4; --ink-2: #b9b9b9; --ink-3: #8b9296; --line: #2e2e2e; --ground: #151515; }
  html, body { background: var(--ground); color: var(--ink); }
  h1, h2, h3, h4 { color: var(--ink); }
  body { display: block; margin: 0; font-family: Barlow, system-ui, sans-serif; }
  .lab { max-width: 92rem; margin: 0 auto; padding: 3.5rem clamp(1rem, 3vw, 2.4rem) 5rem; }
  .kicker { margin: 0; font: 500 .62rem/1 Barlow, sans-serif; letter-spacing: .24em; text-transform: uppercase; color: var(--ink-3); }
  h1 { margin: .8rem 0 0; font: 700 clamp(1.8rem, 3.2vw, 2.8rem)/1 "Playfair Display", serif; }
  h2 { margin: 0 0 .3rem; font: 700 1.5rem "Playfair Display", serif; }
  .lede { margin: .8rem 0 0; max-width: 50rem; font: italic 400 1.1rem/1.4 Didot, "Playfair Display", serif; color: var(--ink-2); }
  .register { margin-top: 3.5rem; padding-top: 1.6rem; border-top: 1px dotted var(--line); }
  .register > p { margin: 0 0 1.4rem; max-width: 50rem; font: 400 .78rem/1.5 Barlow, sans-serif; color: var(--ink-3); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(26rem, 1fr)); gap: 2.4rem 2rem; }
  .piece h3 { margin: .7rem 0 0; font: 500 .62rem Barlow, sans-serif; letter-spacing: .22em; text-transform: uppercase; color: var(--ink-3); }
  canvas { display: block; width: 100%; height: auto; }
  .celestial canvas { max-width: 22rem; }
  select { margin-top: 1.4rem; padding: .35rem .6rem; border: 1px solid var(--line); border-radius: 5px; background: #1c1c1c; color: var(--ink); font: 500 .74rem Barlow, sans-serif; }
</style>
</head>
<body>
<main class="lab">
  <p class="kicker">Lab · QSD's Palette</p>
  <h1>A voyage's mood, seven ways</h1>
  <p class="lede">The one large image at the top of each voyage's palette page, to convey a feeling rather than information: the same five colours in seven registers. Choose by eye.</p>
  <label><select id="pick" multiple size="1" hidden></select></label>
  <div id="stage"></div>
</main>
<script type="module">
const data = await (await fetch('/assets/palettes.json')).json();
const WANT = ['london', 'rigi', 'morocco', 'japan/kyoto'];
const voyages = WANT.map((g) => data.voyages.find((v) => v.g === g)).filter(Boolean);
const title = (v) => data.pages[v.g]?.title || v.g;

// Colour helpers: OKLab, for lightness and hue.
const lin = (c) => { c /= 255; return c <= 0.04045 ? c / 12.92 : ((c + 0.055) / 1.055) ** 2.4; };
const rgb = (h) => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
function oklab(h) {
  const [R, G, B] = rgb(h).map(lin);
  const l = Math.cbrt(0.4122214708 * R + 0.5363325363 * G + 0.0514459929 * B), m = Math.cbrt(0.2119034982 * R + 0.6806995451 * G + 0.1073969566 * B), s = Math.cbrt(0.0883024619 * R + 0.2817188376 * G + 0.6299787005 * B);
  return [0.2104542553 * l + 0.793617785 * m - 0.0040720468 * s, 1.9779984951 * l - 2.428592205 * m + 0.4505937099 * s, 0.0259040371 * l + 0.7827717662 * m - 0.808675766 * s];
}
function srgb(L, a, b) {
  const l = (L + 0.3963377774 * a + 0.2158037573 * b) ** 3, m = (L - 0.1055613458 * a - 0.0638541728 * b) ** 3, s = (L - 0.0894841775 * a - 1.291485548 * b) ** 3;
  const g = (v) => { const x = v <= 0.0031308 ? 12.92 * v : 1.055 * v ** (1 / 2.4) - 0.055; return Math.round(Math.min(1, Math.max(0, x)) * 255); };
  return `rgb(${g(4.0767416621 * l - 3.3077115913 * m + 0.2309699292 * s)},${g(-1.2684380046 * l + 2.6097574011 * m - 0.3413193965 * s)},${g(-0.0041960863 * l - 0.7034186147 * m + 1.707614701 * s)})`;
}
const dotsOf = (str) => { const out = []; for (let i = 0; str && i + 8 <= str.length; i += 8) out.push([`#${str.slice(i, i + 6)}`, (parseInt(str.slice(i + 6, i + 8), 16) || 1) / 255]); return out; };
const looksBlack = (h) => { const [L, a, b] = oklab(h); return L < 0.25 && Math.hypot(a, b) < 0.05; };
let seed = 7; const rand = () => { seed = (seed * 16807) % 2147483647; return seed / 2147483647; };

function canvas(w, h) {
  const c = document.createElement('canvas'), dpr = Math.min(2, devicePixelRatio || 1);
  c.width = w * dpr; c.height = h * dpr; c.style.aspectRatio = `${w} / ${h}`;
  const ctx = c.getContext('2d'); ctx.scale(dpr, dpr);
  return [c, ctx];
}
function grain(ctx, w, h, amount = 0.05) {
  const img = ctx.getImageData(0, 0, ctx.canvas.width, ctx.canvas.height), d = img.data;
  for (let i = 0; i < d.length; i += 4) { const n = (rand() - 0.5) * 255 * amount; d[i] += n; d[i + 1] += n; d[i + 2] += n; }
  ctx.putImageData(img, 0, 0);
}

// Painterly: the voyage's colours as soft horizontal fields, light above and dark below, as a sky
// over its land; each field as tall as its share (tempered), edges dissolved, a little grain.
function painterly(v) {
  const W = 640, H = 400, [c, ctx] = canvas(W, H);
  const cs = v.palette.map((p) => ({ hex: p.hex, w: Math.sqrt(p.pc), L: oklab(p.hex)[0] })).sort((a, b) => b.L - a.L);
  const total = cs.reduce((s, x) => s + x.w, 0);
  const [L0, a0, b0] = oklab(cs[cs.length - 1].hex);
  ctx.fillStyle = srgb(Math.max(0.12, L0 * 0.55), a0 * 0.6, b0 * 0.6); ctx.fillRect(0, 0, W, H);
  let y = 26;
  for (const x of cs) {
    const hh = (H - 52) * (x.w / total);
    ctx.save(); ctx.filter = 'blur(18px)'; ctx.fillStyle = x.hex; ctx.globalAlpha = 0.92;
    ctx.fillRect(34 + rand() * 8, y + 4, W - 68 - rand() * 8, hh - 8); ctx.restore();
    y += hh;
  }
  ctx.filter = 'none'; grain(ctx, W, H, 0.045);
  return c;
}

// Celestial: every frame's 24 dots on the wheel of hue, pooled into a nebula, softly lit.
function celestial(v) {
  const S = 420, [c, ctx] = canvas(S, S), C = S / 2, R = C - 6;
  ctx.fillStyle = '#111113'; ctx.beginPath(); ctx.arc(C, C, R, 0, 2 * Math.PI); ctx.fill();
  for (let i = 0; i < 180; i++) { const t0 = (i / 180) * 2 * Math.PI, t1 = ((i + 1.1) / 180) * 2 * Math.PI, t = (t0 + t1) / 2; ctx.strokeStyle = srgb(0.7, 0.11 * Math.cos(t), 0.11 * Math.sin(t)); ctx.globalAlpha = 0.5; ctx.lineWidth = 1.4; ctx.beginPath(); ctx.arc(C, C, R, -t1, -t0); ctx.stroke(); }
  const dots = v.photos.flatMap((p) => dotsOf(p.dots)).filter(([h]) => !looksBlack(h));
  for (const pass of [{ blur: 6, a: 0.35, k: 2.4 }, { blur: 0, a: 0.85, k: 1 }]) {
    ctx.filter = pass.blur ? `blur(${pass.blur}px)` : 'none'; ctx.globalAlpha = pass.a;
    for (const [h, w] of dots) {
      const [, a, b] = oklab(h), ch = Math.hypot(a, b), r = Math.min(1, Math.sqrt(ch / 0.2)) * (R - 10), t = Math.atan2(b, a);
      ctx.fillStyle = h; ctx.beginPath(); ctx.arc(C + r * Math.cos(t), C - r * Math.sin(t), (1.1 + Math.sqrt(w) * 7) * pass.k, 0, 2 * Math.PI); ctx.fill();
    }
  }
  ctx.filter = 'none'; ctx.globalAlpha = 1;
  return c;
}

// Editorial: a printed colour index: the colours as one proportional band, hairlines between,
// hex and share set beneath like a colophon.
function editorial(v) {
  const W = 640, H = 400, [c, ctx] = canvas(W, H);
  ctx.fillStyle = '#151515'; ctx.fillRect(0, 0, W, H);
  const cs = v.palette, total = cs.reduce((s, x) => s + x.pc, 0);
  let x = 24; const top = 40, band = 250;
  for (const p of cs) {
    const w = (W - 48) * (p.pc / total);
    ctx.fillStyle = p.hex; ctx.fillRect(x, top, Math.max(1, w - 2), band);
    ctx.fillStyle = '#e4e4e4'; ctx.font = '500 11px Barlow'; ctx.fillText(p.hex.slice(1).toUpperCase(), x, top + band + 26);
    ctx.fillStyle = '#8b9296'; ctx.font = 'italic 400 14px Didot, "Playfair Display", serif'; ctx.fillText(`${p.pc}%`, x, top + band + 48);
    x += w;
  }
  ctx.fillStyle = '#8b9296'; ctx.font = '500 10px Barlow'; ctx.fillText(`QSD'S PALETTE FOR ${title(v).toUpperCase()}`.split('').join(String.fromCharCode(8202)), 24, 24);
  return c;
}

// Textile: every frame woven as a patch (its 24 dots, 6 × 4, lightest on top), patches in the
// book's order, thread-thin seams between; the voyage as a tapestry.
function textile(v) {
  const W = 640, ps = v.photos.filter((p) => p.dots), per = Math.min(12, Math.ceil(Math.sqrt(ps.length * 1.9)));
  const rows = Math.ceil(ps.length / per), cell = Math.floor((W - 48) / (per * 6 + (per - 1) * 0.5));
  const pw = cell * 6, ph = cell * 4, gap = Math.max(2, Math.round(cell / 2));
  const H = rows * (ph + gap) + 48, [c, ctx] = canvas(W, H);
  ctx.fillStyle = '#121212'; ctx.fillRect(0, 0, W, H);
  const x0 = (W - (per * pw + (per - 1) * gap)) / 2;
  ps.forEach((p, k) => {
    const dots = dotsOf(p.dots).sort((a, b) => oklab(b[0])[0] - oklab(a[0])[0]);
    const px = x0 + (k % per) * (pw + gap), py = 24 + Math.floor(k / per) * (ph + gap);
    dots.forEach(([h], i) => { ctx.fillStyle = h; ctx.fillRect(px + (i % 6) * cell, py + Math.floor(i / 6) * cell, cell - 0.6, cell - 0.6); });
  });
  return c;
}

// A voyage's own seed, so its painting is always the same painting.
const seedOf = (g) => { let h = 2166136261; for (const ch of g) { h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619) >>> 0; } return (h % 2147483646) + 1; };
const gauss = () => { let u = 0; for (let i = 0; i < 6; i++) u += rand(); return u / 6 - 0.5; }; // roughly normal, −0.5…0.5
const weighted = (cs) => { let r = rand() * cs.reduce((s, c) => s + c.w, 0); for (const c of cs) if ((r -= c.w) <= 0) return c; return cs[cs.length - 1]; };
function jitter(hex, dl = 0.03, dc = 0.012) { const [L, a, b] = oklab(hex); return srgb(L + gauss() * dl * 2, a + gauss() * dc * 2, b + gauss() * dc * 2); }

// A splash's outline: a polygon deformed again and again (each edge split, its middle pushed out
// or in at random), so no two splashes, and no two layers of one, are the same shape.
function deform(pts, depth, spread) {
  for (let d = 0; d < depth; d++) {
    const out = [];
    for (let i = 0; i < pts.length; i++) {
      const [x1, y1, v1] = pts[i], [x2, y2] = pts[(i + 1) % pts.length];
      const len = Math.hypot(x2 - x1, y2 - y1), ang = Math.atan2(y2 - y1, x2 - x1) + (rand() - 0.5) * Math.PI;
      const push = gauss() * len * spread * v1 * 2;
      out.push([x1, y1, v1], [(x1 + x2) / 2 + Math.cos(ang) * push, (y1 + y2) / 2 + Math.sin(ang) * push, v1 * (0.8 + rand() * 0.4)]);
    }
    pts = out;
  }
  return pts;
}
const poly = (ctx, pts) => { ctx.beginPath(); pts.forEach(([x, y], i) => (i ? ctx.lineTo(x, y) : ctx.moveTo(x, y))); ctx.closePath(); };

// Watercolour: each colour a splash, as large as its share, built from dozens of translucent,
// newly deformed layers, so its edges bleed and pool as pigment does; on warm paper, hung on the wall.
function watercolour(v) {
  seed = seedOf(v.g);
  const W = 640, H = 420, [c, ctx] = canvas(W, H);
  ctx.fillStyle = '#151515'; ctx.fillRect(0, 0, W, H);
  const px = 26, py = 26, PW = W - 2 * px, PH = H - 2 * py;
  ctx.fillStyle = '#efe8dc'; ctx.fillRect(px, py, PW, PH);
  ctx.save(); ctx.beginPath(); ctx.rect(px, py, PW, PH); ctx.clip();
  const cs = v.palette.map((p) => ({ hex: p.hex, w: Math.sqrt(p.pc) })).sort((a, b) => b.w - a.w);
  const total = cs.reduce((s, x) => s + x.w, 0);
  cs.forEach((col, k) => {
    const r = Math.sqrt(col.w / total) * PW * 0.46;
    const cx = px + PW * (0.2 + rand() * 0.6), cy = py + PH * (0.22 + rand() * 0.56);
    const base = deform(Array.from({ length: 10 }, (_, i) => { const t = (i / 10) * 2 * Math.PI; return [cx + r * Math.cos(t), cy + r * 0.8 * Math.sin(t), 1]; }), 3, 0.35);
    ctx.globalCompositeOperation = 'multiply';
    for (let layer = 0; layer < 36; layer++) {
      ctx.globalAlpha = 0.045; ctx.fillStyle = col.hex;
      poly(ctx, deform(base.map((p) => [...p]), 3, 0.28)); ctx.fill();
    }
  });
  ctx.restore(); ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
  grain(ctx, W, H, 0.035);
  return c;
}

// Impressionist oil: thousands of short strokes on a dark ground, each colour as many as its share,
// the light colours drifting up like a sky, every stroke following a gentle flow and never quite the
// same colour as the last, as paint never mixes evenly.
function impressionist(v) {
  seed = seedOf(v.g);
  const W = 640, H = 420, [c, ctx] = canvas(W, H);
  const cs = v.palette.map((p) => ({ hex: p.hex, w: Math.sqrt(p.pc), L: oklab(p.hex)[0] }));
  const Ls = cs.map((x) => x.L), lo = Math.min(...Ls), hi = Math.max(...Ls);
  const dark = cs.reduce((a, b) => (b.L < a.L ? b : a));
  const [dL, da, db] = oklab(dark.hex); ctx.fillStyle = srgb(dL * 0.6, da * 0.6, db * 0.6); ctx.fillRect(0, 0, W, H);
  ctx.lineCap = 'round';
  for (let i = 0; i < 5200; i++) {
    const col = weighted(cs), up = hi > lo ? (col.L - lo) / (hi - lo) : 0.5;
    const x = rand() * W, y = Math.min(H, Math.max(0, H * (1 - up) * 0.85 + gauss() * H * 0.9 + H * 0.08));
    const ang = Math.sin(x * 0.011) * 0.6 + Math.cos(y * 0.013) * 0.5 + gauss() * 0.5;
    const len = 7 + rand() * 13, wid = 3 + rand() * 4;
    ctx.strokeStyle = jitter(col.hex); ctx.globalAlpha = 0.78 + rand() * 0.2; ctx.lineWidth = wid;
    ctx.beginPath(); ctx.moveTo(x - Math.cos(ang) * len / 2, y - Math.sin(ang) * len / 2); ctx.lineTo(x + Math.cos(ang) * len / 2, y + Math.sin(ang) * len / 2); ctx.stroke();
  }
  ctx.globalAlpha = 1; grain(ctx, W, H, 0.04);
  return c;
}

// Circles: the colours as four or five soft discs, irregular in size and place, glowing into each other.
function circles(v) {
  seed = seedOf(v.g);
  const W = 640, H = 420, [c, ctx] = canvas(W, H);
  ctx.fillStyle = '#131314'; ctx.fillRect(0, 0, W, H);
  const cs = v.palette.map((p) => ({ hex: p.hex, w: Math.sqrt(p.pc) })).sort((a, b) => b.w - a.w);
  const total = cs.reduce((s, x) => s + x.w, 0);
  ctx.globalCompositeOperation = 'screen';
  for (const col of cs) {
    const r = Math.sqrt(col.w / total) * W * 0.34, x = W * (0.22 + rand() * 0.56), y = H * (0.25 + rand() * 0.5);
    const g = ctx.createRadialGradient(x, y, r * 0.15, x, y, r);
    g.addColorStop(0, col.hex); g.addColorStop(0.7, col.hex); g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.globalAlpha = 0.9; ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, 2 * Math.PI); ctx.fill();
  }
  ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1; grain(ctx, W, H, 0.03);
  return c;
}

const REGISTERS = [
  ['Watercolour', 'watercolour', 'Each of the five colours as an irregular splash, as large as its share, laid in dozens of translucent layers so the edges bleed and pool; on warm paper, hung on the dark wall.', watercolour],
  ['Impressionist', 'impressionist', 'Thousands of short strokes in the five colours, as many of each as its share, the light ones drifting up like a sky, never quite the same colour twice.', impressionist],
  ['Circles', 'circles', 'The five colours as soft discs, irregular in size and place, glowing into each other.', circles],
  ['Painterly', 'painterly', 'Soft fields that dissolve into each other, light above and dark below, each as tall as its share: a sky over its land, at dusk. Pure mood; nothing to read.', painterly],
  ['Celestial', 'celestial', 'Every colour of every frame as a point of light on the wheel of hue: the voyage as a nebula. Mood with a trace of order.', celestial],
  ['Editorial', 'editorial', 'A printed colour index: one band in true proportion, hex and share set beneath like a colophon. Exact and quiet.', editorial],
  ['Textile', 'textile', 'Every frame woven as a patch of its 24 colours, lightest on top, in the book\'s order: the voyage as a tapestry.', textile],
];
const stage = document.getElementById('stage');
await document.fonts.ready;
for (const [name, cls, note, draw] of REGISTERS) {
  const sec = document.createElement('section'); sec.className = `register ${cls}`;
  sec.innerHTML = `<h2>${name}</h2><p>${note}</p><div class="grid"></div>`;
  const grid = sec.querySelector('.grid');
  for (const v of voyages) { seed = 7; const fig = document.createElement('figure'); fig.className = 'piece'; fig.style.margin = 0; fig.appendChild(draw(v)); fig.insertAdjacentHTML('beforeend', `<h3>${title(v)}</h3>`); grid.appendChild(fig); }
  stage.appendChild(sec);
}
</script>
</body>
</html>
