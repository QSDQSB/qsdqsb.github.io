<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cards + the door</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@300;400;500&family=Playfair+Display:wght@700&display=swap">
<link rel="stylesheet" href="doors.css">
<style>
/* Today's card view, refined: the same stacked 3.5:1 doors, but at full colour (no wash over the
   whole photograph, only a fade at the foot for the words), square like the Photobook's prints, the
   poem always there, no lift on hover. Approaching a card, its picture breathes (depth). Opening
   one is the door: it grows into the place the book's cover will take, the camera leaning into its
   depth and settling, and the book begins with that same picture. */
.hero { position: relative; width: 100%; height: max(calc(100vw / 3), 26rem); overflow: hidden; margin-bottom: clamp(2rem, 5vw, 4rem); }
.hero > img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.hero::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(21,21,21,0) 45%, rgba(21,21,21,0.55) 78%, var(--ground)); }
.hero__words { position: absolute; z-index: 1; left: var(--gutter); right: var(--gutter); bottom: clamp(1rem, 3vw, 2.2rem); }
.hero h1 { margin: 0; font: 700 clamp(2.4rem, 5.4vw, 4.6rem)/1 var(--display); }
.hero .poem { margin-top: 0.6rem; }

.cards { width: min(100% - 2 * var(--gutter), 118rem); margin: 0 auto 8rem; display: grid; grid-template-columns: minmax(0, 1fr); gap: clamp(1rem, 2vw, 1.5rem); }
.card { position: relative; display: block; width: 100%; aspect-ratio: 3.5; }
.card .pic { position: absolute; inset: 0; }
.card .pic::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(10,10,10,0) 48%, rgba(10,10,10,0.58)); pointer-events: none; }
.card__words { position: absolute; z-index: 2; left: clamp(1.1rem, 2.6vw, 2.2rem); right: clamp(1.1rem, 2.6vw, 2.2rem); bottom: clamp(1rem, 2.2vw, 1.8rem); display: grid; gap: 0.35rem; pointer-events: none; }
.card h2 { margin: 0; font: 700 clamp(1.5rem, 2.6vw, 2.4rem)/1.08 var(--display); text-shadow: 0 1px 12px rgba(0,0,0,0.35); }
.card .poem { color: var(--ink-2); transition: color 0.4s var(--ease); }
.card .air { max-height: 0; opacity: 0; overflow: hidden; transition: opacity 0.4s var(--ease), max-height 0.4s var(--ease); color: var(--ink-2); }
.card:hover .poem, .card:focus-visible .poem { color: var(--ink); }
.card:hover .air, .card:focus-visible .air { max-height: 2em; opacity: 1; }
.card:focus-visible { outline: 1px solid var(--ink-3); outline-offset: 4px; }
.cards .card { content-visibility: auto; contain-intrinsic-size: auto 420px; }

/* The door: a canvas laid over the card, growing into the book's cover. */
.door-open { position: fixed; z-index: 100; pointer-events: none; }
.door-veil { position: fixed; inset: 0; z-index: 99; background: var(--ground); opacity: 0; pointer-events: none; }

@media (max-width: 767px) {
  .card { aspect-ratio: 2 / 1; }
  .card .pic::after { background: linear-gradient(to bottom, rgba(10,10,10,0) 30%, rgba(10,10,10,0.72)); }
  .card .poem { font-size: 0.92rem; }
  .hero { height: 120vw; }
}
</style>
</head>
<body>
<script src="data.js"></script>
<script src="depth.js"></script>
<script src="doors.js"></script>
<script>
const { D, voyage, esc, air, pic, href, chrome, mast, wake, IMG } = Doors;
const SK = 'cards.html';
const list = voyage ? voyage.parts : D;
const head = voyage
  ? `<header class="hero"><img src="${IMG}${voyage.cover}" alt="" fetchpriority="high" style="view-transition-name:cover"><div class="hero__words"><h1>${esc(voyage.title)}</h1><p class="poem">${esc(voyage.excerpt)}</p></div></header>`
  : `<header class="hero"><img src="${IMG}pr-tram-3v1.jpg" alt="" fetchpriority="high"><div class="hero__words"><h1>Voyage</h1><p class="poem">Through boundless paths we roam.</p></div></header>`;
const card = (d, i) => `<a class="card" href="${href(d, SK)}" data-door="${esc(d.slug)}">${pic(d, { eager: i < 2 })}
  <div class="card__words"><h2>${esc(d.title)}</h2><p class="poem">${esc(d.excerpt)}</p><p class="air">${air(d)}</p></div></a>`;
document.body.insertAdjacentHTML('beforeend', mast() + head + `<main class="cards">${list.map(card).join('')}</main>`);
chrome(SK);

const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const depthImg = new Map(); // preloaded depth maps, by slug
function preload(d) {
  if (!d?.depth || depthImg.has(d.slug)) return;
  const im = new Image(); im.src = '../../' + d.depth; depthImg.set(d.slug, im);
}
document.querySelectorAll('.card').forEach((a) => {
  const d = Doors.bySlug.get(a.dataset.door);
  a.addEventListener('pointerenter', (e) => { preload(d); if (e.pointerType === 'mouse') wake(a); });
  a.addEventListener('focus', () => preload(d));
  a.addEventListener('touchstart', () => preload(d), { passive: true });
  a.addEventListener('click', (e) => {
    if (e.metaKey || e.ctrlKey || e.shiftKey || e.button) return;
    e.preventDefault();
    open(a, d);
  });
});

// ——— The door ———
let busy = null;
function open(a, d) {
  const url = a.getAttribute('href');
  if (busy) { location.href = busy; return; }           // a second click goes straight in
  busy = url;
  const img = a.querySelector('.pic > img');
  const go = () => { location.href = url; };
  const gl0 = !reduce && img.complete && img.naturalWidth && door.ready();
  const hero = document.querySelector('.hero > img'); if (hero) hero.style.viewTransitionName = ''; // one name per page
  if (!gl0) { img.style.viewTransitionName = 'cover'; go(); return; }
  Doors.sleep();
  const from = a.getBoundingClientRect();
  const W = innerWidth, H = innerHeight;
  const to = { left: 0, top: 0, width: W, height: W < 768 ? W * 1.2 : Math.max(W / 3, 416) }; // where the book's cover will be
  const dm = depthImg.get(d.slug);
  door.load(img, dm && dm.complete && dm.naturalWidth ? dm : null);
  const veil = document.createElement('div'); veil.className = 'door-veil'; document.body.append(veil);
  const c = door.canvas; c.className = 'door-open'; document.body.append(c);
  const T = 760, t0 = performance.now();
  const lerp = (x, y, k) => x + (y - x) * k;
  const inout = (k) => (k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2);
  (function step(now) {
    const k = Math.min(1, (now - t0) / T), e = inout(k);
    const r = { left: lerp(from.left, to.left, e), top: lerp(from.top, to.top, e), width: lerp(from.width, to.width, e), height: lerp(from.height, to.height, e) };
    Object.assign(c.style, { left: r.left + 'px', top: r.top + 'px', width: r.width + 'px', height: r.height + 'px' });
    veil.style.opacity = String(Math.min(1, e * 1.3));
    // The lean: the near field surges as the door opens, then the place settles around you.
    door.draw(r.width / r.height, 0.62 * Math.sin(Math.PI * e), (1 - e) * 0.15);
    if (k < 1) requestAnimationFrame(step);
    else { c.style.viewTransitionName = 'cover'; go(); }
  })(t0);
}

// One small WebGL program: the photograph displaced by its depth map (near swells faster than far).
const door = (() => {
  const canvas = document.createElement('canvas');
  const gl = !reduce && canvas.getContext('webgl', { antialias: false, alpha: false, preserveDrawingBuffer: true });
  if (!gl) return { ready: () => false };
  const V = 'attribute vec2 p; varying vec2 v; void main(){ v = p * 0.5 + 0.5; v.y = 1.0 - v.y; gl_Position = vec4(p, 0.0, 1.0); }';
  const F = `precision mediump float; varying vec2 v; uniform sampler2D uP, uD; uniform vec2 uC; uniform float uPush, uLean;
    vec2 at(vec2 a, float d) { return (a - 0.5) / (1.0 + uPush * (0.12 + d * d * 1.5)) + 0.5 + vec2(uLean, 0.0) * (d - 0.55); }
    void main() { vec2 a = (v - 0.5) * uC + 0.5; float d = texture2D(uD, a).r; vec2 q = at(a, d); d = texture2D(uD, q).r; q = at(a, d); d = texture2D(uD, q).r; q = at(a, d);
      gl_FragColor = vec4(texture2D(uP, clamp(q, 0.0, 1.0)).rgb, 1.0); }`;
  const sh = (t, s) => { const o = gl.createShader(t); gl.shaderSource(o, s); gl.compileShader(o); return o; };
  const pr = gl.createProgram(); gl.attachShader(pr, sh(gl.VERTEX_SHADER, V)); gl.attachShader(pr, sh(gl.FRAGMENT_SHADER, F)); gl.linkProgram(pr); gl.useProgram(pr);
  const b = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, b); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(pr, 'p'); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
  const U = {}; ['uP', 'uD', 'uC', 'uPush', 'uLean'].forEach((n) => { U[n] = gl.getUniformLocation(pr, n); });
  gl.uniform1i(U.uP, 0); gl.uniform1i(U.uD, 1);
  const tex = (unit) => { const t = gl.createTexture(); gl.activeTexture(gl.TEXTURE0 + unit); gl.bindTexture(gl.TEXTURE_2D, t);
    ['TEXTURE_WRAP_S', 'TEXTURE_WRAP_T'].forEach((k) => gl.texParameteri(gl.TEXTURE_2D, gl[k], gl.CLAMP_TO_EDGE));
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR); return t; };
  const tP = tex(0), tD = tex(1);
  // No depth map: the ground is near, the sky far.
  const ground = (() => { const c = document.createElement('canvas'); c.width = 4; c.height = 256; const x = c.getContext('2d'); const g = x.createLinearGradient(0, 0, 0, 256); g.addColorStop(0, '#101010'); g.addColorStop(1, '#c8c8c8'); x.fillStyle = g; x.fillRect(0, 0, 4, 256); return c; })();
  let aspect = 3;
  return {
    canvas,
    ready: () => true,
    load(photo, depth) {
      aspect = photo.naturalWidth / photo.naturalHeight;
      const dpr = Math.min(devicePixelRatio || 1, 1.5);
      canvas.width = Math.round(innerWidth * dpr); canvas.height = Math.round(Math.max(innerWidth / 3, 416, innerWidth < 768 ? innerWidth * 1.2 : 0) * dpr);
      gl.viewport(0, 0, canvas.width, canvas.height);
      gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, tP); gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGB, gl.RGB, gl.UNSIGNED_BYTE, photo);
      gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, tD); gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGB, gl.RGB, gl.UNSIGNED_BYTE, depth || ground);
    },
    draw(boxAspect, push, lean) {
      const cv = boxAspect < aspect ? [boxAspect / aspect, 1] : [1, aspect / boxAspect];
      gl.uniform2fv(U.uC, cv); gl.uniform1f(U.uPush, push); gl.uniform1f(U.uLean, lean * 0.02);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
    },
  };
})();
// Back from a book: the card it came from takes the name, so the parent's cover must let go of it.
addEventListener('pagereveal', () => { const named = [...document.querySelectorAll('.card .pic > img')].some((i) => i.style.viewTransitionName); const hero = document.querySelector('.hero > img'); if (named && hero) hero.style.viewTransitionName = ''; });
addEventListener('pageshow', () => { busy = null; document.querySelectorAll('.door-open, .door-veil').forEach((n) => n.remove()); });
</script>
</body>
</html>
