# Pixel-baseline overrides — layered on by `npm run visual:build` only
# (`--config _config.yml,_config_visual.yml`); the live build never reads it.
# Pins what would otherwise be drawn at random and is too small to paint over
# reliably, so the shots compare it instead of masking it.
visual_baseline: true
# Its content and its clock are held to tests/visual/content-pin.json by scripts/visual-content.rb,
# which visual:build loads ahead of Jekyll and which acts only where this is set.
# The specimen page (_specimen/: every shared piece in every state) is built here and nowhere else.
# `include` replaces the live list, so the live list is repeated before it.
include:
  - .htaccess
  - _pages
  - files
  - _specimen
