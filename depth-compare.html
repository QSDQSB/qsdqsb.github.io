<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Lontananza Depth Bake-off</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Playfair+Display:ital@1&display=swap">
</head>
<body>
<style>
  :root {
    --ground: #0b0b12;
    --ink: #ece7dd;
    --ink-dim: rgba(236, 231, 221, 0.62);
    --gold: #c9a35c;
    --hairline: rgba(236, 231, 221, 0.14);
    --glass: rgba(11, 11, 18, 0.62);
  }
  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: Barlow, "Helvetica Neue", Arial, sans-serif;
    padding: 1rem 1rem calc(5.5rem + env(safe-area-inset-bottom));
  }
  header { margin: 0.4rem 0 1.2rem; }
  h1 {
    font-family: "Playfair Display", Didot, Georgia, serif;
    font-style: italic;
    font-weight: 400;
    font-size: 1.5rem;
    margin: 0;
  }
  header p {
    margin: 0.35rem 0 0;
    font-size: 0.72rem;
    letter-spacing: 0.06em;
    color: var(--ink-dim);
    max-width: 34rem;
    line-height: 1.5;
  }
  .hero-block { margin: 0 0 1.6rem; }
  .hero-block > h2 {
    font-size: 0.68rem;
    font-weight: 600;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--ink-dim);
    margin: 0 0 0.6rem;
  }
  .panel { margin: 0 0 0.9rem; }
  .panel .tag {
    display: inline-block;
    font-size: 0.62rem;
    font-weight: 600;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--gold);
    margin: 0 0 0.35rem;
  }
  .panel .tag small { color: var(--ink-dim); letter-spacing: 0.08em; margin-left: 0.6rem; text-transform: none; }
  .stage {
    position: relative;
    width: 100%;
    border-radius: 0.4rem;
    overflow: hidden;
    border: 1px solid var(--hairline);
    background: #000;
  }
  .stage canvas { display: block; width: 100%; height: 100%; }
  #bar {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    display: flex;
    align-items: center;
    gap: 1rem;
    padding: 0.7rem 1.1rem calc(0.7rem + env(safe-area-inset-bottom));
    background: var(--glass);
    -webkit-backdrop-filter: blur(14px);
    backdrop-filter: blur(14px);
    border-top: 1px solid var(--hairline);
  }
  #bar label {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    font-size: 0.62rem;
    font-weight: 600;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--ink-dim);
    white-space: nowrap;
  }
  #bar input[type="range"] {
    -webkit-appearance: none;
    appearance: none;
    width: 8rem;
    height: 1.2rem;
    background: transparent;
  }
  #bar input[type="range"]::-webkit-slider-runnable-track { height: 2px; background: var(--hairline); }
  #bar input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 1rem; height: 1rem; border-radius: 50%;
    background: var(--gold); border: 3px solid var(--ground);
    margin-top: calc((2px - 1rem) / 2);
  }
  #bar input[type="range"]::-moz-range-track { height: 2px; background: var(--hairline); }
  #bar input[type="range"]::-moz-range-thumb { width: 0.7rem; height: 0.7rem; border-radius: 50%; background: var(--gold); border: 3px solid var(--ground); }
  #bar input[type="checkbox"] { accent-color: var(--gold); width: 0.95rem; height: 0.95rem; }
  #tilt-btn {
    margin-left: auto;
    font-family: Barlow, sans-serif;
    font-size: 0.62rem;
    font-weight: 600;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--ground);
    background: var(--gold);
    border: 0;
    border-radius: 999px;
    padding: 0.5rem 1.1rem;
    cursor: pointer;
  }
  #tilt-btn[hidden] { display: none; }
  #tilt-btn:focus-visible, #bar input:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
</style>

<header>
  <h1>Lontananza — depth bake-off</h1>
  <p>Same shader, same motion, different depth models. Move the pointer (or enable tilt
     on iPhone — works on the pages.dev copy, not inside the claude.ai artifact frame).
     Toggle “depth” to see the raw maps. Amp is deliberately hot so differences shout.</p>
</header>

<div id="panels"></div>

<div id="bar">
  <label>Amp <input type="range" id="amp" min="20" max="200" step="5" value="110"></label>
  <label><input type="checkbox" id="show-depth"> Depth</label>
  <button id="tilt-btn" type="button" hidden>Enable tilt</button>
</div>

<script>
(function () {
  'use strict';

  var HEROES = [
    {
      name: 'QSD_Night_4v1',
      label: 'About hero — sparkler light-writing',
      photo: '__P4__',
      maps: [
        ['v1-small · current', '__D4_V1__'],
        ['v2-base · 14s', '__D4_V2B__'],
        ['v2-large · 33s', '__D4_V2L__']
      ]
    },
    {
      name: 'QSD_Night_5v2',
      label: 'Home hero — night figure',
      photo: '__P5__',
      maps: [
        ['v1-small · current', '__D5_V1__'],
        ['v2-base · 13s', '__D5_V2B__'],
        ['v2-large · 16s', '__D5_V2L__']
      ]
    }
  ];
  // Site build: placeholders stay literal (no data: prefix) — derive real paths.
  HEROES.forEach(function (h) {
    if (h.photo.indexOf('data:') !== 0) {
      h.photo = '/images/' + h.name + '.jpg';
      h.maps[0][1] = '/images/depth/' + h.name + '.jpg.depth.jpg';
      h.maps[1][1] = '/images/depth/' + h.name + '.jpg.depth.v2b.jpg';
      h.maps[2][1] = '/images/depth/' + h.name + '.jpg.depth.v2l.jpg';
    }
  });

  var VERT = 'attribute vec2 aPos; varying vec2 vUv;' +
    'void main(){ vUv = aPos*0.5+0.5; vUv.y = 1.0-vUv.y; gl_Position = vec4(aPos,0.,1.); }';
  var FRAG = [
    'precision mediump float; varying vec2 vUv;',
    'uniform sampler2D uPhoto; uniform sampler2D uDepth;',
    'uniform vec2 uTilt; uniform vec2 uCover; uniform float uAmp; uniform float uFocus; uniform float uShow;',
    'void main(){',
    '  vec2 uv = (vUv-0.5)*uCover*0.94+0.5;',
    '  vec2 off = uTilt*uAmp*uCover;', // even screen-space parallax
    '  float d = texture2D(uDepth, uv).r;',
    '  vec2 p = uv+off*(d-uFocus); d = texture2D(uDepth,p).r;',
    '  p = uv+off*(d-uFocus); d = texture2D(uDepth,p).r;',
    '  p = uv+off*(d-uFocus); d = texture2D(uDepth,p).r;',
    '  p = uv+off*(d-uFocus);',
    '  vec3 photo = texture2D(uPhoto,p).rgb;',
    '  vec3 depthv = texture2D(uDepth,p).rrr;',
    '  gl_FragColor = vec4(mix(photo, depthv, uShow), 1.0);',
    '}'
  ].join('\n');

  var AMP_EL = document.getElementById('amp');
  var SHOW_EL = document.getElementById('show-depth');
  var target = { x: 0, y: 0 };
  var tilt = { x: 0, y: 0 };
  var lastInput = -1e9;
  var panels = [];

  function makePanel(container, hero, mapLabel, mapSrc) {
    var wrap = document.createElement('div');
    wrap.className = 'panel';
    wrap.innerHTML = '<span class="tag">' + mapLabel + '</span>';
    var stage = document.createElement('div');
    stage.className = 'stage';
    var canvas = document.createElement('canvas');
    stage.appendChild(canvas);
    wrap.appendChild(stage);
    container.appendChild(wrap);

    var gl = canvas.getContext('webgl', { antialias: false, alpha: false });
    if (!gl) { stage.textContent = 'no webgl'; return; }
    function sh(t, s) { var o = gl.createShader(t); gl.shaderSource(o, s); gl.compileShader(o); return o; }
    var prog = gl.createProgram();
    gl.attachShader(prog, sh(gl.VERTEX_SHADER, VERT));
    gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, FRAG));
    gl.linkProgram(prog);
    gl.useProgram(prog);
    var buf = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
    var aPos = gl.getAttribLocation(prog, 'aPos');
    gl.enableVertexAttribArray(aPos);
    gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);
    var U = {};
    ['uPhoto', 'uDepth', 'uTilt', 'uCover', 'uAmp', 'uFocus', 'uShow'].forEach(function (n) { U[n] = gl.getUniformLocation(prog, n); });
    gl.uniform1i(U.uPhoto, 0);
    gl.uniform1i(U.uDepth, 1);

    var p = { gl: gl, U: U, canvas: canvas, stage: stage, aspect: 3, loaded: 0, visible: true };
    function tex(unit, src) {
      var t = gl.createTexture();
      var img = new Image();
      img.onload = function () {
        if (unit === 0) {
          p.aspect = img.naturalWidth / img.naturalHeight;
          stage.style.aspectRatio = p.aspect;
          resizePanel(p);
        }
        gl.activeTexture(gl.TEXTURE0 + unit);
        gl.bindTexture(gl.TEXTURE_2D, t);
        gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGB, gl.RGB, gl.UNSIGNED_BYTE, img);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
        p.loaded += 1;
      };
      img.onerror = function () { wrap.querySelector('.tag').textContent = mapLabel + ' — load failed'; };
      img.src = src;
    }
    tex(0, hero.photo);
    tex(1, mapSrc);
    panels.push(p);
    if ('IntersectionObserver' in window) {
      new IntersectionObserver(function (es) { p.visible = es[0].isIntersecting; }).observe(stage);
    }
  }

  function resizePanel(p) {
    var dpr = Math.min(window.devicePixelRatio || 1, 1.5);
    var w = p.stage.clientWidth;
    if (!w) return;
    var h = Math.round(w / p.aspect);
    p.canvas.width = Math.round(w * dpr);
    p.canvas.height = Math.round(h * dpr);
  }
  window.addEventListener('resize', function () { panels.forEach(resizePanel); });

  HEROES.forEach(function (hero) {
    var block = document.createElement('section');
    block.className = 'hero-block';
    block.innerHTML = '<h2>' + hero.label + '</h2>';
    hero.maps.forEach(function (m) { makePanel(block, hero, m[0], m[1]); });
    document.getElementById('panels').appendChild(block);
  });

  /* shared input: pointer */
  document.addEventListener('pointermove', function (e) {
    target.x = Math.max(-0.5, Math.min(0.5, e.clientX / window.innerWidth - 0.5));
    target.y = Math.max(-0.5, Math.min(0.5, e.clientY / window.innerHeight - 0.5));
    lastInput = performance.now();
  }, { passive: true });

  /* shared input: gyro (compact adapter — baseline drift + flip guard) */
  var base = null, lastRaw = null, lastEvT = 0;
  function screenAngle() {
    if (screen.orientation && typeof screen.orientation.angle === 'number') return screen.orientation.angle;
    if (typeof window.orientation === 'number') return (window.orientation + 360) % 360;
    return 0;
  }
  function onOrient(e) {
    if (e.beta == null || e.gamma == null) return;
    var now = performance.now();
    var a = screenAngle(), x, y;
    switch (a) {
      case 90: x = e.beta; y = -e.gamma; break;
      case 180: x = -e.gamma; y = -e.beta; break;
      case 270: x = -e.beta; y = e.gamma; break;
      default: x = e.gamma; y = e.beta;
    }
    if (base === null) { base = { x: x, y: y }; lastRaw = { x: x, y: y }; lastEvT = now; }
    var jx = x - lastRaw.x, jy = y - lastRaw.y;
    if (Math.abs(jx) > 25 || Math.abs(jy) > 25) { base.x += jx; base.y += jy; }
    lastRaw.x = x; lastRaw.y = y;
    var dt = Math.min((now - lastEvT) / 1000, 0.2);
    lastEvT = now;
    var kk = 1 - Math.exp(-dt / 7);
    base.x += (x - base.x) * kk;
    base.y += (y - base.y) * kk;
    target.x = Math.max(-0.5, Math.min(0.5, (x - base.x) / 28));
    target.y = Math.max(-0.5, Math.min(0.5, (y - base.y) / 28));
    lastInput = now;
  }
  var tiltBtn = document.getElementById('tilt-btn');
  if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
    tiltBtn.hidden = false;
    tiltBtn.addEventListener('click', function () {
      DeviceOrientationEvent.requestPermission().then(function (r) {
        if (r === 'granted') { tiltBtn.hidden = true; window.addEventListener('deviceorientation', onOrient); }
        else tiltBtn.textContent = 'Denied';
      }).catch(function () { tiltBtn.textContent = 'Blocked here'; });
    });
  } else if (typeof DeviceOrientationEvent !== 'undefined') {
    window.addEventListener('deviceorientation', onOrient);
  }

  function draw(t) {
    var s = t * 0.001;
    if (performance.now() - lastInput > 2500) {
      target.x = 0.34 * Math.sin(s * 0.19);
      target.y = 0.22 * Math.sin(s * 0.13 + 1.3);
    }
    tilt.x += (target.x - tilt.x) * 0.06;
    tilt.y += (target.y - tilt.y) * 0.06;
    var amp = (parseFloat(AMP_EL.value) / 100) * 0.05;
    var show = SHOW_EL.checked ? 1 : 0;
    panels.forEach(function (p) {
      if (!p.visible || p.loaded < 2) return;
      var gl = p.gl;
      var cw = p.canvas.width, ch = p.canvas.height;
      if (!cw || !ch) return;
      gl.viewport(0, 0, cw, ch);
      var canvasAspect = cw / ch;
      var cx = 1, cy = 1;
      if (canvasAspect < p.aspect) { cx = canvasAspect / p.aspect; } else { cy = p.aspect / canvasAspect; }
      gl.uniform2f(p.U.uTilt, tilt.x, tilt.y);
      gl.uniform2f(p.U.uCover, cx, cy);
      gl.uniform1f(p.U.uAmp, amp);
      gl.uniform1f(p.U.uFocus, 0.75);
      gl.uniform1f(p.U.uShow, show);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
    });
    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);
})();
</script>

</body>
</html>
