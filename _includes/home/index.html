<section class="home__index" aria-label="Enter the house">
  <div class="home__section-head">
    <span class="home__label">The House &mdash; four ways in</span>
    <span class="home__note">Choose a door.</span>
  </div>

  <div class="home__index-grid">
    <ul class="home__doors">
      <li><a class="door" href="{{ '/year-archive/' | relative_url }}">
        <span class="door__num">01</span>
        <span class="door__text"><span class="door__title">Posts</span><span class="door__desc">Words, essays, and epitaphs</span></span>
        <span class="door__arrow" aria-hidden="true">&rarr;</span>
      </a></li>
      <li><a class="door" href="{{ '/voyage/' | relative_url }}">
        <span class="door__num">02</span>
        <span class="door__text"><span class="door__title">Voyage</span><span class="door__desc">Photographs from the road</span></span>
        <span class="door__arrow" aria-hidden="true">&rarr;</span>
      </a></li>
      <li><a class="door" href="{{ '/portfolio/' | relative_url }}">
        <span class="door__num">03</span>
        <span class="door__text"><span class="door__title">Portfolio</span><span class="door__desc">Selected things I&rsquo;ve made</span></span>
        <span class="door__arrow" aria-hidden="true">&rarr;</span>
      </a></li>
      <li><a class="door" href="{{ '/cv/' | relative_url }}">
        <span class="door__num">04</span>
        <span class="door__text"><span class="door__title">CV</span><span class="door__desc">Formally, and in brief</span></span>
        <span class="door__arrow" aria-hidden="true">&rarr;</span>
      </a></li>
    </ul>

    <div class="home__index-stage" aria-hidden="true">
      <figure class="door-plate">
        <div class="door-plate__frame">
          <div class="door-shot is-on" style="background-image:url('{{ '/images/Legotypewriter1-3v1.jpg' | relative_url }}');"></div>
          <div class="door-shot" style="background-image:url('{{ '/images/cover/Prague-charles-bridge-dawn-2-3v1.jpg' | relative_url }}');"></div>
          <div class="door-shot" style="background-image:url('{{ '/images/ZahaHadid1-3v1.jpg' | relative_url }}');"></div>
          <div class="door-shot" style="background-image:url('{{ '/images/cover/qsd-emblem-palace-night-with-candle-vase-3v1.jpg' | relative_url }}');"></div>
          <span class="door-plate__vignette"></span>
          <span class="door-plate__grain"></span>
        </div>
        <figcaption class="door-plate__meta">
          <span class="door-plate__no" id="doorPlateNo">N&deg;&#8201;01</span>
          <span class="door-plate__enter">Enter <i aria-hidden="true">&#8599;</i></span>
        </figcaption>
      </figure>
    </div>
  </div>
</section>
